<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Operação OR bit a bit entre duas palavras de 8 bits</title>
  <desc id="desc">A palavra A 00000101 é combinada com a máscara 00001000, produzindo o resultado 00001101.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; }
      .title { font-size: 34px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 18px; fill: #526078; }
      .label { font-size: 21px; font-weight: 650; fill: #263247; }
      .index { font-size: 15px; fill: #68758a; }
      .digit { font-size: 32px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .note { font-size: 17px; fill: #526078; }
      .arrow { stroke: #a9b2c1; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b2c1"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="62" text-anchor="middle" class="sans title">OR bit a bit</text>
  <text x="600" y="94" text-anchor="middle" class="sans subtitle">Um bit vale 1 no resultado quando pelo menos uma das entradas vale 1</text>

  <!-- column indices -->
  <g class="mono index" text-anchor="middle">
    <text x="414" y="148">bit 7</text><text x="486" y="148">bit 6</text>
    <text x="558" y="148">bit 5</text><text x="630" y="148">bit 4</text>
    <text x="702" y="148">bit 3</text><text x="774" y="148">bit 2</text>
    <text x="846" y="148">bit 1</text><text x="918" y="148">bit 0</text>
  </g>

  <!-- row labels -->
  <g class="sans label" text-anchor="end">
    <text x="350" y="213">Palavra A</text>
    <text x="350" y="333">Máscara 1&lt;&lt;3</text>
    <text x="350" y="493">Resultado</text>
  </g>

  <!-- A row -->
  <g class="mono digit">
    <g fill="#697386">
      <rect x="382" y="174" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="414" y="207">0</text>
      <rect x="454" y="174" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="486" y="207">0</text>
      <rect x="526" y="174" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="558" y="207">0</text>
      <rect x="598" y="174" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="630" y="207">0</text>
      <rect x="670" y="174" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="702" y="207">0</text>
      <rect x="814" y="174" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="846" y="207">0</text>
    </g>
    <g fill="#12653b">
      <rect x="742" y="174" width="64" height="64" rx="10" fill="#d9f5e5" stroke="#39a96b" stroke-width="2"/><text x="774" y="207">1</text>
      <rect x="886" y="174" width="64" height="64" rx="10" fill="#d9f5e5" stroke="#39a96b" stroke-width="2"/><text x="918" y="207">1</text>
    </g>
  </g>

  <!-- mask row -->
  <g class="mono digit">
    <g fill="#697386">
      <rect x="382" y="294" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="414" y="327">0</text>
      <rect x="454" y="294" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="486" y="327">0</text>
      <rect x="526" y="294" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="558" y="327">0</text>
      <rect x="598" y="294" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="630" y="327">0</text>
      <rect x="742" y="294" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="774" y="327">0</text>
      <rect x="814" y="294" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="846" y="327">0</text>
      <rect x="886" y="294" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="918" y="327">0</text>
    </g>
    <g fill="#815b00">
      <rect x="670" y="294" width="64" height="64" rx="10" fill="#fff0b8" stroke="#e5ae1a" stroke-width="2"/><text x="702" y="327">1</text>
    </g>
  </g>

  <!-- OR separator -->
  <circle cx="330" cy="407" r="24" fill="#eef3ff" stroke="#7995d4" stroke-width="2"/>
  <text x="330" y="414" text-anchor="middle" class="mono label" fill="#34528f">OR</text>
  <line x1="382" y1="407" x2="950" y2="407" stroke="#263247" stroke-width="3"/>

  <!-- positional arrows -->
  <g class="arrow">
    <path d="M414 366 V449"/><path d="M486 366 V449"/><path d="M558 366 V449"/><path d="M630 366 V449"/>
    <path d="M702 366 V449"/><path d="M774 366 V449"/><path d="M846 366 V449"/><path d="M918 366 V449"/>
  </g>

  <!-- result row -->
  <g class="mono digit">
    <g fill="#697386">
      <rect x="382" y="454" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="414" y="487">0</text>
      <rect x="454" y="454" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="486" y="487">0</text>
      <rect x="526" y="454" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="558" y="487">0</text>
      <rect x="598" y="454" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="630" y="487">0</text>
      <rect x="814" y="454" width="64" height="64" rx="10" fill="#f0f2f5"/><text x="846" y="487">0</text>
    </g>
    <g fill="#12653b">
      <rect x="742" y="454" width="64" height="64" rx="10" fill="#d9f5e5" stroke="#39a96b" stroke-width="2"/><text x="774" y="487">1</text>
      <rect x="886" y="454" width="64" height="64" rx="10" fill="#d9f5e5" stroke="#39a96b" stroke-width="2"/><text x="918" y="487">1</text>
    </g>
    <g fill="#815b00">
      <rect x="670" y="454" width="64" height="64" rx="10" fill="#fff0b8" stroke="#e5ae1a" stroke-width="2"/><text x="702" y="487">1</text>
    </g>
  </g>

  <!-- exact expressions -->
  <g class="mono" font-size="20" fill="#263247">
    <text x="600" y="568" text-anchor="middle">00000101  OR  00001000  =  00001101</text>
  </g>

  <!-- legend -->
  <g class="sans note">
    <rect x="330" y="615" width="22" height="22" rx="5" fill="#d9f5e5" stroke="#39a96b"/>
    <text x="365" y="632">bits 0 e 2 já ativos em A</text>
    <rect x="650" y="615" width="22" height="22" rx="5" fill="#fff0b8" stroke="#e5ae1a"/>
    <text x="685" y="632">bit 3 acrescentado pela máscara</text>
  </g>
</svg>
