<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Registrador GPIO_OUT de 32 bits do ESP32</title>
  <desc id="desc">Barra de 32 bits numerada de 31 a 0, com os GPIOs 18, 5, 4 e 2 destacados e ligados a desenhos compactos de LEDs físicos acesos.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; }
      .title { font-size: 36px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 18px; fill: #56647a; }
      .bitnum { font-size: 15px; fill: #4e5b70; text-anchor: middle; }
      .gpio { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .caption { font-size: 17px; fill: #445169; }
      .legend { font-size: 16px; fill: #4e5b70; }
    </style>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="ledRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="45%" stop-color="#ed2525"/>
      <stop offset="100%" stop-color="#9b1010"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="720" fill="#ffffff"/>
  <text x="800" y="64" class="sans title" text-anchor="middle">Registrador GPIO_OUT — ESP32</text>
  <text x="800" y="98" class="sans subtitle" text-anchor="middle">32 bits: cada posição controla uma saída GPIO correspondente</text>

  <!-- bit numbers, from 31 at left to 0 at right -->
  <g class="mono bitnum">
    <text x="118" y="180">31</text><text x="162" y="180">30</text><text x="206" y="180">29</text><text x="250" y="180">28</text>
    <text x="294" y="180">27</text><text x="338" y="180">26</text><text x="382" y="180">25</text><text x="426" y="180">24</text>
    <text x="470" y="180">23</text><text x="514" y="180">22</text><text x="558" y="180">21</text><text x="602" y="180">20</text>
    <text x="646" y="180">19</text><text x="690" y="180">18</text><text x="734" y="180">17</text><text x="778" y="180">16</text>
    <text x="822" y="180">15</text><text x="866" y="180">14</text><text x="910" y="180">13</text><text x="954" y="180">12</text>
    <text x="998" y="180">11</text><text x="1042" y="180">10</text><text x="1086" y="180">9</text><text x="1130" y="180">8</text>
    <text x="1174" y="180">7</text><text x="1218" y="180">6</text><text x="1262" y="180">5</text><text x="1306" y="180">4</text>
    <text x="1350" y="180">3</text><text x="1394" y="180">2</text><text x="1438" y="180">1</text><text x="1482" y="180">0</text>
  </g>

  <!-- 32 register cells -->
  <g stroke="#b8c0cc" stroke-width="1.5">
    <rect x="96" y="196" width="44" height="96" fill="#eef1f5"/><rect x="140" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="184" y="196" width="44" height="96" fill="#eef1f5"/><rect x="228" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="272" y="196" width="44" height="96" fill="#eef1f5"/><rect x="316" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="360" y="196" width="44" height="96" fill="#eef1f5"/><rect x="404" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="448" y="196" width="44" height="96" fill="#eef1f5"/><rect x="492" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="536" y="196" width="44" height="96" fill="#eef1f5"/><rect x="580" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="624" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="668" y="196" width="44" height="96" rx="3" fill="#2878d0" stroke="#125ca9" stroke-width="2.5"/>
    <rect x="712" y="196" width="44" height="96" fill="#eef1f5"/><rect x="756" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="800" y="196" width="44" height="96" fill="#eef1f5"/><rect x="844" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="888" y="196" width="44" height="96" fill="#eef1f5"/><rect x="932" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="976" y="196" width="44" height="96" fill="#eef1f5"/><rect x="1020" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="1064" y="196" width="44" height="96" fill="#eef1f5"/><rect x="1108" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="1152" y="196" width="44" height="96" fill="#eef1f5"/><rect x="1196" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="1240" y="196" width="44" height="96" rx="3" fill="#2878d0" stroke="#125ca9" stroke-width="2.5"/>
    <rect x="1284" y="196" width="44" height="96" rx="3" fill="#2878d0" stroke="#125ca9" stroke-width="2.5"/>
    <rect x="1328" y="196" width="44" height="96" fill="#eef1f5"/>
    <rect x="1372" y="196" width="44" height="96" rx="3" fill="#2878d0" stroke="#125ca9" stroke-width="2.5"/>
    <rect x="1416" y="196" width="44" height="96" fill="#eef1f5"/><rect x="1460" y="196" width="44" height="96" fill="#eef1f5"/>
  </g>

  <!-- GPIO labels inside active cells -->
  <g class="mono gpio">
    <text x="690" y="248" transform="rotate(-90 690 248)">GPIO 18</text>
    <text x="1262" y="248" transform="rotate(-90 1262 248)">GPIO 5</text>
    <text x="1306" y="248" transform="rotate(-90 1306 248)">GPIO 4</text>
    <text x="1394" y="248" transform="rotate(-90 1394 248)">GPIO 2</text>
  </g>

  <!-- connector lines -->
  <g stroke="#2878d0" stroke-width="3" fill="none">
    <path d="M690 292 V390"/><path d="M1262 292 V390"/><path d="M1306 292 V390"/><path d="M1394 292 V390"/>
  </g>
  <g fill="#2878d0">
    <circle cx="690" cy="302" r="4"/><circle cx="1262" cy="302" r="4"/><circle cx="1306" cy="302" r="4"/><circle cx="1394" cy="302" r="4"/>
  </g>

  <!-- physical illuminated LEDs, compact to prevent overlap -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(690 390)">
      <path d="M-7 35 V58 M7 35 V53" stroke="#8b969f" stroke-width="3"/>
      <path d="M-14 34 H14 L12 38 H-12 Z" fill="#a80f0f"/>
      <path d="M-12 34 V17 A12 12 0 0 1 12 17 V34 Z" fill="url(#ledRed)" stroke="#861010" stroke-width="1.5"/>
      <path d="M-7 16 A7 7 0 0 1 4 10" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".8"/>
      <circle cx="0" cy="27" r="3.5" fill="#fff2f2" opacity=".9"/>
    </g>
    <g transform="translate(1262 390)">
      <path d="M-7 35 V58 M7 35 V53" stroke="#8b969f" stroke-width="3"/>
      <path d="M-14 34 H14 L12 38 H-12 Z" fill="#a80f0f"/>
      <path d="M-12 34 V17 A12 12 0 0 1 12 17 V34 Z" fill="url(#ledRed)" stroke="#861010" stroke-width="1.5"/>
      <path d="M-7 16 A7 7 0 0 1 4 10" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".8"/>
      <circle cx="0" cy="27" r="3.5" fill="#fff2f2" opacity=".9"/>
    </g>
    <g transform="translate(1306 390)">
      <path d="M-7 35 V58 M7 35 V53" stroke="#8b969f" stroke-width="3"/>
      <path d="M-14 34 H14 L12 38 H-12 Z" fill="#a80f0f"/>
      <path d="M-12 34 V17 A12 12 0 0 1 12 17 V34 Z" fill="url(#ledRed)" stroke="#861010" stroke-width="1.5"/>
      <path d="M-7 16 A7 7 0 0 1 4 10" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".8"/>
      <circle cx="0" cy="27" r="3.5" fill="#fff2f2" opacity=".9"/>
    </g>
    <g transform="translate(1394 390)">
      <path d="M-7 35 V58 M7 35 V53" stroke="#8b969f" stroke-width="3"/>
      <path d="M-14 34 H14 L12 38 H-12 Z" fill="#a80f0f"/>
      <path d="M-12 34 V17 A12 12 0 0 1 12 17 V34 Z" fill="url(#ledRed)" stroke="#861010" stroke-width="1.5"/>
      <path d="M-7 16 A7 7 0 0 1 4 10" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".8"/>
      <circle cx="0" cy="27" r="3.5" fill="#fff2f2" opacity=".9"/>
    </g>
  </g>

  <!-- LED labels aligned vertically, read from bottom to top -->
  <g class="mono caption" text-anchor="start">
    <text x="690" y="530" transform="rotate(-90 690 530)">LED 18</text>
    <text x="1262" y="530" transform="rotate(-90 1262 530)">LED 5</text>
    <text x="1306" y="530" transform="rotate(-90 1306 530)">LED 4</text>
    <text x="1394" y="530" transform="rotate(-90 1394 530)">LED 2</text>
  </g>

  <!-- explanatory panel -->
  <rect x="325" y="565" width="950" height="82" rx="12" fill="#f7f9fc" stroke="#d7dde7"/>
  <rect x="365" y="592" width="26" height="26" rx="4" fill="#2878d0"/>
  <text x="410" y="612" class="sans legend">bits utilizados: 18, 5, 4 e 2</text>
  <rect x="755" y="592" width="26" height="26" rx="4" fill="#eef1f5" stroke="#b8c0cc"/>
  <text x="800" y="612" class="sans legend">demais posições do registrador</text>
</svg>
