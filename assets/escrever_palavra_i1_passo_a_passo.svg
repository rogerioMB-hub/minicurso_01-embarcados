<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">escrever_palavra(0b1010) — como funciona: iteração i = 1</title>
  <desc id="desc">Quatro passos mostram a extração do bit 1 da palavra 1010, seu deslocamento, isolamento com a máscara 1 e aplicação ao LED1 no GPIO4.</desc>
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace; }
      .title { font-size: 19px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .subtitle { font-size: 13px; fill: #5b687c; text-anchor: middle; }
      .step { font-size: 14px; font-weight: 700; fill: #2878d0; }
      .block-title { font-size: 15px; font-weight: 700; fill: #2e3a4d; }
      .small { font-size: 12px; fill: #5b687c; }
      .digit { font-size: 22px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .digit-sm { font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .annotation { font-size: 12px; fill: #6b4b00; dominant-baseline: middle; }
    </style>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dd8a00"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8994a3"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#218b52"/>
    </marker>
    <linearGradient id="ledRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7272"/><stop offset="45%" stop-color="#ef2525"/><stop offset="100%" stop-color="#961010"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff3030" stop-opacity=".45"/><stop offset="100%" stop-color="#ff3030" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="680" fill="#ffffff"/>
  <text x="450" y="31" class="mono title">escrever_palavra(0b1010) — como funciona: iteração i = 1</text>
  <text x="450" y="54" class="mono subtitle">extraindo o bit 1 da palavra e aplicando ao LED1 (GPIO4)</text>

  <!-- separators -->
  <g stroke="#e1e6ed" stroke-width="1.5">
    <line x1="28" y1="187" x2="872" y2="187"/>
    <line x1="28" y1="327" x2="872" y2="327"/>
    <line x1="28" y1="550" x2="872" y2="550"/>
  </g>

  <!-- PASSO 1 -->
  <text x="32" y="91" class="mono step">Passo 1</text>
  <text x="148" y="91" class="mono block-title">Palavra original</text>
  <text x="270" y="116" class="mono small">0b1010</text>
  <text x="430" y="116" class="mono small" fill="#a76700">i = 1</text>
  <g class="mono small" text-anchor="middle">
    <text x="250" y="137">bit 3</text><text x="306" y="137">bit 2</text><text x="362" y="137">bit 1</text><text x="418" y="137">bit 0</text>
  </g>
  <g>
    <rect x="223" y="143" width="54" height="38" rx="6" fill="#eef1f5" stroke="#c5ccd6"/>
    <rect x="279" y="143" width="54" height="38" rx="6" fill="#eef1f5" stroke="#c5ccd6"/>
    <rect x="335" y="143" width="54" height="38" rx="6" fill="#fff0b8" stroke="#dd8a00" stroke-width="2"/>
    <rect x="391" y="143" width="54" height="38" rx="6" fill="#eef1f5" stroke="#c5ccd6"/>
    <g class="mono digit"><text x="250" y="163" fill="#485568">1</text><text x="306" y="163" fill="#7a8492">0</text><text x="362" y="163" fill="#6b4b00">1</text><text x="418" y="163" fill="#7a8492">0</text></g>
  </g>
  <path d="M389 162 H490" stroke="#dd8a00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="502" y="163" class="mono annotation">← queremos este bit</text>

  <!-- PASSO 2 -->
  <text x="32" y="215" class="mono step">Passo 2</text>
  <text x="148" y="215" class="mono block-title">palavra &gt;&gt; 1 (deslocamento)</text>
  <text x="175" y="246" class="mono small">original</text>
  <g>
    <rect x="152" y="255" width="34" height="31" rx="4" fill="#eef1f5" stroke="#c5ccd6"/><rect x="188" y="255" width="34" height="31" rx="4" fill="#eef1f5" stroke="#c5ccd6"/>
    <rect x="224" y="255" width="34" height="31" rx="4" fill="#fff0b8" stroke="#dd8a00"/><rect x="260" y="255" width="34" height="31" rx="4" fill="#eef1f5" stroke="#c5ccd6"/>
    <g class="mono digit-sm"><text x="169" y="271" fill="#677384">1</text><text x="205" y="271" fill="#677384">0</text><text x="241" y="271" fill="#6b4b00">1</text><text x="277" y="271" fill="#677384">0</text></g>
  </g>
  <path d="M324 271 H394" stroke="#8994a3" stroke-width="4" marker-end="url(#arrowGray)"/>
  <text x="350" y="252" class="mono small">&gt;&gt; 1</text>
  <g>
    <rect x="430" y="250" width="48" height="39" rx="6" fill="#eef1f5" stroke="#c5ccd6"/><rect x="480" y="250" width="48" height="39" rx="6" fill="#eef1f5" stroke="#c5ccd6"/>
    <rect x="530" y="250" width="48" height="39" rx="6" fill="#eef1f5" stroke="#c5ccd6"/><rect x="580" y="250" width="48" height="39" rx="6" fill="#fff0b8" stroke="#dd8a00" stroke-width="2"/>
    <g class="mono digit"><text x="454" y="270" fill="#7a8492">0</text><text x="504" y="270" fill="#485568">1</text><text x="554" y="270" fill="#7a8492">0</text><text x="604" y="270" fill="#6b4b00">1</text></g>
  </g>
  <path d="M241 250 C285 222 560 218 604 246" fill="none" stroke="#dd8a00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <path d="M628 269 H657" stroke="#dd8a00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="668" y="270" class="mono annotation">← bit desejado agora</text>
  <text x="668" y="286" class="mono annotation">na posição 0</text>

  <!-- PASSO 3 -->
  <text x="32" y="355" class="mono step">Passo 3</text>
  <text x="148" y="355" class="mono block-title">&amp; 1 (isolar o bit 0)</text>
  <text x="175" y="390" class="mono small">deslocada</text>
  <g>
    <rect x="330" y="369" width="46" height="34" rx="5" fill="#eef1f5" stroke="#c5ccd6"/><rect x="378" y="369" width="46" height="34" rx="5" fill="#eef1f5" stroke="#c5ccd6"/>
    <rect x="426" y="369" width="46" height="34" rx="5" fill="#eef1f5" stroke="#c5ccd6"/><rect x="474" y="369" width="46" height="34" rx="5" fill="#fff0b8" stroke="#dd8a00" stroke-width="2"/>
    <g class="mono digit-sm"><text x="353" y="386" fill="#7a8492">0</text><text x="401" y="386" fill="#485568">1</text><text x="449" y="386" fill="#7a8492">0</text><text x="497" y="386" fill="#6b4b00">1</text></g>
  </g>
  <text x="287" y="430" class="mono block-title" text-anchor="middle">AND</text>
  <text x="175" y="442" class="mono small">máscara &amp; 1</text>
  <g>
    <rect x="330" y="420" width="46" height="34" rx="5" fill="#eef1f5" stroke="#c5ccd6"/><rect x="378" y="420" width="46" height="34" rx="5" fill="#eef1f5" stroke="#c5ccd6"/>
    <rect x="426" y="420" width="46" height="34" rx="5" fill="#eef1f5" stroke="#c5ccd6"/><rect x="474" y="420" width="46" height="34" rx="5" fill="#dbeafe" stroke="#4d91e8" stroke-width="2"/>
    <g class="mono digit-sm"><text x="353" y="437" fill="#7a8492">0</text><text x="401" y="437" fill="#7a8492">0</text><text x="449" y="437" fill="#7a8492">0</text><text x="497" y="437" fill="#1c5fae">1</text></g>
  </g>
  <path d="M520 437 H562" stroke="#4d91e8" stroke-width="2"/>
  <text x="573" y="438" class="mono small" fill="#1c5fae">máscara</text>
  <line x1="322" y1="463" x2="528" y2="463" stroke="#607087" stroke-width="2"/>
  <text x="175" y="503" class="mono small">resultado</text>
  <g>
    <rect x="330" y="475" width="46" height="36" rx="5" fill="#eef1f5" stroke="#c5ccd6"/><rect x="378" y="475" width="46" height="36" rx="5" fill="#eef1f5" stroke="#c5ccd6"/>
    <rect x="426" y="475" width="46" height="36" rx="5" fill="#eef1f5" stroke="#c5ccd6"/><rect x="474" y="475" width="46" height="36" rx="5" fill="#d9f5e5" stroke="#218b52" stroke-width="2"/>
    <g class="mono digit-sm"><text x="353" y="493" fill="#7a8492">0</text><text x="401" y="493" fill="#7a8492">0</text><text x="449" y="493" fill="#7a8492">0</text><text x="497" y="493" fill="#17653c">1</text></g>
  </g>
  <path d="M520 493 H562" stroke="#218b52" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="574" y="494" class="mono small" fill="#17653c">resultado = 1</text>

  <!-- PASSO 4 -->
  <text x="32" y="580" class="mono step">Passo 4</text>
  <text x="148" y="580" class="mono block-title">pino.value(1)</text>
  <path d="M497 511 C497 536 470 547 470 566" fill="none" stroke="#218b52" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="300" y="568" width="295" height="78" rx="9" fill="#f3fbf6" stroke="#91cbaa"/>
  <text x="320" y="591" class="mono small" fill="#17653c">0001 e 1 representam o mesmo valor</text>
  <text x="320" y="612" class="mono small" fill="#17653c">1 = True → nível alto no GPIO4</text>
  <text x="320" y="633" class="mono small" fill="#17653c">somente o LED1 recebe esse valor</text>
  <path d="M595 607 H620" fill="none" stroke="#218b52" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <g transform="translate(655 576)">
    <circle cx="0" cy="21" r="34" fill="url(#redGlow)"/>
    <path d="M-8 39 V62 M8 39 V57" stroke="#8d979f" stroke-width="4" stroke-linecap="round"/>
    <path d="M-17 38 H17 L14 43 H-14 Z" fill="#a80f0f"/>
    <path d="M-15 38 V20 A15 15 0 0 1 15 20 V38 Z" fill="url(#ledRed)" stroke="#8b1010" stroke-width="2"/>
    <path d="M-9 19 A9 9 0 0 1 5 11" fill="none" stroke="#ffffff" stroke-width="3" opacity=".85"/>
    <circle cx="0" cy="31" r="4" fill="#fff4f4" opacity=".9"/>
  </g>
  <text x="710" y="610" class="mono block-title" fill="#a80f0f">GPIO4 → LED1 → ACESO</text>
</svg>
